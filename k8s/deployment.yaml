apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-brain-erp
  namespace: system-brain-erp
  labels:
    app.kubernetes.io/name: system-brain-erp
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: system-brain-erp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: system-brain-erp
    spec:
      containers:
        - name: app
          image: system-brain-erp:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5175
          envFrom:
            - configMapRef:
                name: system-brain-erp-config
          readinessProbe:
            httpGet:
              path: /api/crm/agents
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/crm/agents
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
